name: Task
description: Track one task from docs/tasks (the spec lives in the task file, not here)
title: 'T-000: '
labels: [task]
body:
  - type: input
    id: task-file
    attributes:
      label: Task file
      description: Path of the task spec
      placeholder: docs/tasks/T-000-short-name.md
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything not in the task file yet (decisions, links). Prefer updating the task file.
