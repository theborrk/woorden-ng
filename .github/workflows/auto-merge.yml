name: Auto merge

# Unattended mode: merges every open pull request that is green (`ci-ok`), approved by Claude for
# its current head commit (`claude-review`) and up to date with main. A pull request that is behind
# is updated from main first, so CI tests what will actually land. Off unless `autoMerge` is true in
# .github/agent-loop.json. Labels `hold`, `needs-human` and `blocked` keep a pull request out.
#
# Uses the AUTOMATION_TOKEN secret (your fine-grained token) so that updates and merges start the
# usual workflows; without it, merges still work but branch updates and Codex requests don't.
on:
  workflow_run:
    workflows: [CI, Review gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    name: Merge approved pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib
            .github/agent-loop.json
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        env:
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const orch = require('./scripts/lib/orchestrator.cjs');
            const config = JSON.parse(fs.readFileSync('.github/agent-loop.json', 'utf8'));
            if (!config.autoMerge) {
              core.notice('autoMerge is off in .github/agent-loop.json');
              return;
            }
            const usingToken = process.env.HAS_AUTOMATION_TOKEN === 'true';
            const { owner, repo } = context.repo;
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const base = repoInfo.default_branch;
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base, per_page: 100 });
            open.sort((a, b) => a.number - b.number);

            let mergedOne = false;
            for (const listed of open) {
              // pulls.get computes `mergeable`; it can be null right after a push, so ask once more.
              let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: listed.number });
              if (pr.mergeable === null) {
                await new Promise((resolve) => setTimeout(resolve, 3000));
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: listed.number }));
              }
              const sha = pr.head.sha;
              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, check_name: 'ci-ok', per_page: 100 });
              runs.sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
              const ciOk = runs[0] ? (runs[0].conclusion ?? runs[0].status) : null;
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              const review = combined.statuses.find((s) => s.context === 'claude-review');
              const { data: compare } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${base}...${sha}` });

              const decision = orch.mergeDecision({
                config,
                pr: { state: pr.state, draft: pr.draft, mergeable: pr.mergeable, author: pr.user.login },
                labels: pr.labels.map((l) => l.name),
                ciOk,
                claudeReview: review ? review.state : null,
                behindBy: mergedOne ? Math.max(compare.behind_by, 1) : compare.behind_by,
              });
              core.info(`#${pr.number} ${sha.slice(0, 7)}: ${decision.action} (${decision.reason})`);

              if (decision.action === 'merge') {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha, merge_method: 'squash', commit_title: `${pr.title} (#${pr.number})` });
                mergedOne = true;
                core.notice(`Merged #${pr.number}`);
                // A merge made with the default token does not start the Main workflow by itself.
                if (!usingToken) await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'main.yml', ref: base });
              } else if (decision.action === 'update' || decision.action === 'conflict') {
                if (!usingToken) {
                  core.warning(`#${pr.number} needs an update from ${base}; add the AUTOMATION_TOKEN secret to do that automatically.`);
                  continue;
                }
                let conflict = decision.action === 'conflict';
                if (!conflict) {
                  try {
                    await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number, expected_head_sha: sha });
                    core.notice(`Updated #${pr.number} from ${base}; CI runs again`);
                  } catch (error) {
                    if (error.status !== 422) throw error;
                    conflict = true;
                  }
                }
                if (conflict) {
                  const marker = `${orch.CONFLICT_MARKER_PREFIX} sha=${sha} -->`;
                  const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                  if (comments.some((c) => c.body.includes(marker))) continue;
                  const body = config.codexAutoFix
                    ? `${config.codexMention} This branch conflicts with ${base}. Merge the latest ${base} into it, resolve the conflicts keeping the intent of both sides, run npm run verify and npm run test:e2e:web, and push to this branch.\n\n${marker}`
                    : `This branch conflicts with ${base}: resolve the conflicts (ask Codex in the task that opened this PR).\n\n${marker}`;
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                  if (!config.codexAutoFix) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['needs-human'] });
                }
              }
            }
