name: Main

# After every merge to main: deploy the production PWA and publish a dev APK
# to the rolling "dev-latest" pre-release (install it once; Obtainium can keep it updated).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  deploy-pwa:
    name: Deploy production PWA
    if: vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the PWA (dist/web)
        run: npm run build:web
      - id: deploy
        uses: ./.github/actions/pages-deploy
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ vars.CF_PAGES_PROJECT }}
          branch: main
          directory: dist/web

  dev-apk:
    name: Build dev APK
    if: vars.DEV_APK_ON_MAIN != 'false'
    uses: ./.github/workflows/android-build.yml
    with:
      build-type: debug
      version-label: main

  publish-dev-apk:
    name: Publish dev APK
    needs: dev-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.dev-apk.outputs.apk-name }}
          path: out
      - name: Update the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.dev-apk.outputs.apk-name }}
        run: |
          set -euo pipefail
          apk="$(find out -name '*.apk' | head -1)"
          cp "$apk" out/app-dev.apk
          git tag -f dev-latest "$GITHUB_SHA"
          git push -f origin refs/tags/dev-latest
          notes="Latest build of main ($(git log -1 --format='%h %s')). Debug build: installs next to the release app as a separate '.dev' app. File: $APK_NAME"
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --prerelease --title "Dev build (main)" --notes "$notes"
          else
            gh release create dev-latest --prerelease --title "Dev build (main)" --notes "$notes" --verify-tag
          fi
          gh release upload dev-latest out/app-dev.apk --clobber
          echo "Dev APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/app-dev.apk" >> "$GITHUB_STEP_SUMMARY"
